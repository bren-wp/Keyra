<svg xmlns="http://www.w3.org/2000/svg" width="480" height="854" viewBox="0 0 480 854"><rect width="480" height="854" rx="42" fill="#06111F"/><text x="28" y="48" fill="#fff" font-family="Arial" font-size="22" font-weight="700">9:41</text><text x="28" y="105" fill="#fff" font-family="Arial" font-size="40" font-weight="800">Keyra</text><text x="28" y="136" fill="#AABBD5" font-family="Arial" font-size="15" letter-spacing="3">POSTAVKE I SIGURNOST</text><rect x="28" y="165" width="424" height="54" rx="24" fill="#0B2034" stroke="#315777"/><text x="65" y="199" fill="#91A8C9" font-family="Arial" font-size="16">Pretražite postavke...</text><text x="28" y="258" fill="#7DD3FC" font-family="Arial" font-size="13" letter-spacing="3">RAČUN I SIGURNOST</text><g font-family="Arial"><g transform="translate(28 278)"><rect width="424" height="80" rx="18" fill="#0B2034" stroke="#234C6C"/><text x="64" y="31" fill="#fff" font-size="18" font-weight="700">Biometrijsko otključavanje</text><text x="64" y="55" fill="#AABBD5" font-size="13">Brz i siguran pristup trezoru.</text></g><g transform="translate(28 370)"><rect width="424" height="80" rx="18" fill="#0B2034" stroke="#234C6C"/><text x="64" y="31" fill="#fff" font-size="18" font-weight="700">Provjera sigurnosti</text><text x="64" y="55" fill="#AABBD5" font-size="13">Pronađite slabe i ponovljene lozinke.</text></g><g transform="translate(28 490)"><rect width="424" height="80" rx="18" fill="#0B2034" stroke="#234C6C"/><text x="64" y="31" fill="#fff" font-size="18" font-weight="700">Sigurnosna kopija</text><text x="64" y="55" fill="#AABBD5" font-size="13">Izvoz i povrat šifriranog trezora.</text></g><g transform="translate(28 582)"><rect width="424" height="80" rx="18" fill="#0B2034" stroke="#234C6C"/><text x="64" y="31" fill="#fff" font-size="18" font-weight="700">Tamni način</text><text x="64" y="55" fill="#AABBD5" font-size="13">Čistije i ugodnije iskustvo za oči.</text></g><g transform="translate(28 674)"><rect width="424" height="80" rx="18" fill="#0B2034" stroke="#234C6C"/><text x="64" y="31" fill="#fff" font-size="18" font-weight="700">O aplikaciji Keyra</text><text x="64" y="55" fill="#AABBD5" font-size="13">Vaši ključevi. Vaši podaci. Uvijek vaši.</text></g></g></svg>