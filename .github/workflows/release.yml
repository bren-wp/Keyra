name: Ručno GitHub izdanje

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Verzija bez prefiksa v; mora odgovarati Android/iOS verziji, npr. 0.5.0"
        required: true
        default: "0.5.0"

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  android:
    name: Android paketi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Provjeri usklađenost verzije
        run: |
          set -euo pipefail
          grep -F "versionName = \"${VERSION}\"" android/app/build.gradle.kts
          grep -F "MARKETING_VERSION = ${VERSION};" ios/Keyra.xcodeproj/project.pbxproj

      - name: Izradi APK i AAB
        run: |
          gradle -p android :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Keyra-${VERSION}-Android.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/Keyra-${VERSION}-Android-unsigned.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Keyra-${VERSION}-Android.aab"
          cd dist
          sha256sum * > SHA256SUMS-Android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keyra-android-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS paketi
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Izradi paket za iPhone i iPad
        run: |
          set -euo pipefail
          mkdir -p dist

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_PATH="build/device/Build/Products/Release-iphoneos/Keyra.app"
          test -d "$APP_PATH"
          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/
          (
            cd build/package
            zip -qry "../../dist/Keyra-${VERSION}-iOS-unsigned.ipa" Payload
          )

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/analyze \
            CODE_SIGNING_ALLOWED=NO \
            analyze

          SIM_APP="build/simulator/Build/Products/Release-iphonesimulator/Keyra.app"
          test -d "$SIM_APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$SIM_APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          ')
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$SIM_APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 3
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$UDID" || true

          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" "dist/Keyra-${VERSION}-iOS-Simulator.zip"

          cd dist
          shasum -a 256 * > SHA256SUMS-iOS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keyra-ios-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Objavi izdanje
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: keyra-*
          path: dist
          merge-multiple: true

      - name: Pripremi bilješke izdanja
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # Keyra ${VERSION}

          Ovo GitHub izdanje sadrži provjerene razvojne pakete iz točnog release commita.

          ## Provjere
          - Android lint i unit testovi
          - Android debug/release APK i release AAB
          - iOS Release build i analyze
          - iOS simulator launch smoke test
          - SHA-256 kontrolne sume artefakata

          ## Važno za trgovine
          Android AAB i iOS IPA iz ovog javnog workflowa nisu zamjena za produkcijsko store potpisivanje. Google Play upload mora biti potpisan upload ključem/Play App Signingom, a App Store build odgovarajućim Apple distribucijskim identitetom i provisioning profilom.

          Pogledajte docs/STORE_RELEASE_CHECKLIST.md prije objave u trgovinama.
          EOF

      - name: Objavi ili ažuriraj GitHub izdanje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
            gh release edit "v${VERSION}" --title "Keyra ${VERSION}" --notes-file RELEASE_NOTES.md
          else
            gh release create "v${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "Keyra ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              dist/*
          fi
