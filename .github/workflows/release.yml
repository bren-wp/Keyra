name: Izdanje 0.5.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.5.0"

jobs:
  android:
    name: Android paketi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Izradi APK i AAB
        run: |
          gradle -p android :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Keyra-${VERSION}-Android.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/Keyra-${VERSION}-Android-unsigned.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Keyra-${VERSION}-Android.aab"
          cd dist
          sha256sum * > SHA256SUMS-Android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keyra-android-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS paketi
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Izradi paket za iPhone i iPad
        run: |
          set -euo pipefail
          mkdir -p dist

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_PATH="build/device/Build/Products/Release-iphoneos/Keyra.app"
          test -d "$APP_PATH"
          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/
          (
            cd build/package
            zip -qry "../../dist/Keyra-${VERSION}-iOS-unsigned.ipa" Payload
          )

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/analyze \
            CODE_SIGNING_ALLOWED=NO \
            analyze

          SIM_APP="build/simulator/Build/Products/Release-iphonesimulator/Keyra.app"
          test -d "$SIM_APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$SIM_APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          ')
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$SIM_APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 3
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$UDID" || true

          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" "dist/Keyra-${VERSION}-iOS-Simulator.zip"

          cd dist
          shasum -a 256 * > SHA256SUMS-iOS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keyra-ios-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Objavi izdanje
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: keyra-*
          path: dist
          merge-multiple: true

      - name: Pripremi bilješke izdanja
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Keyra 0.5.0

          Keyra 0.5.0 usmjerena je na stabilnost, sigurnije rukovanje podacima i dovršavanje svakodnevnih radnji u trezoru.

          ## Novo i poboljšano
          - zaštita od rušenja pri oštećenim ili neočekivanim spremljenim podacima
          - postojeći sadržaj trezora ostaje sačuvan ako spremanje, brisanje ili uvoz ne uspiju
          - sigurnosne kopije provjeravaju format, veličinu i dopušten broj stavki prije uvoza
          - poboljšano rukovanje Android Keystore i Apple Keychain pogreškama
          - uklonjena prisilna iOS provjera koja je u rijetkim slučajevima mogla zatvoriti aplikaciju
          - potvrda prije trajnog brisanja stavke
          - broj kartice, sigurnosni kod i broj dokumenta otkrivaju se zasebno
          - web-adrese se provjeravaju prije otvaranja i ne mogu srušiti prikaz detalja
          - kartice u Kolekcijama sada otvaraju odgovarajuće filtrirani Trezor
          - aktivni filtar kategorije jasno je prikazan i može se ukloniti jednim dodirom
          - gumb obavijesti više nije neaktivan i prikazuje stvarno stanje
          - postavka tamnog prikaza jasno pokazuje da je uvijek uključena
          - zadržana su sva poboljšanja prilagodbe malim telefonima, većim ekranima, tabletima i vodoravnom prikazu iz 0.4.0

          ## Dodatne provjere kvalitete
          - proširene automatske provjere Android paketa
          - proširena analiza iOS aplikacije
          - automatska provjera pokretanja iOS aplikacije u simulatoru prije objave
          - izdanje se objavljuje tek nakon uspješnih Android i iOS provjera

          ## Sigurnost
          - AES-256-GCM zaštita sadržaja trezora
          - ključevi zaštićeni Android Keystoreom ili Apple Keychainom
          - PBKDF2-HMAC-SHA-256 s 600.000 iteracija
          - dodatna potvrda identiteta prije prikaza i kopiranja osjetljivih podataka
          - podesivo automatsko zaključavanje
          - zaštita od uzastopnog pogađanja glavne lozinke
          - osjetljivi sadržaj međuspremnika automatski istječe

          ## Paketi
          - `Keyra-0.5.0-Android.apk`
          - `Keyra-0.5.0-Android.aab`
          - `Keyra-0.5.0-Android-unsigned.apk`
          - `Keyra-0.5.0-iOS-unsigned.ipa`
          - `Keyra-0.5.0-iOS-Simulator.zip`

          iOS paket bez distribucijskog potpisa potrebno je potpisati odgovarajućim Apple certifikatom i profilom prije instalacije na fizički uređaj ili objave.
          EOF

      - name: Objavi ili ažuriraj GitHub izdanje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
            gh release edit "v${VERSION}" --title "Keyra ${VERSION}" --notes-file RELEASE_NOTES.md
          else
            gh release create "v${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "Keyra ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              dist/*
          fi
