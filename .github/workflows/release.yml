name: Keyra GitHub izdanje

on:
  push:
    branches: [main]
    paths:
      - "android/app/build.gradle.kts"
      - "ios/Keyra.xcodeproj/project.pbxproj"
  workflow_dispatch:
    inputs:
      version:
        description: "Verzija bez prefiksa v; mora odgovarati Android/iOS verziji"
        required: false
        default: "0.6.29"

permissions:
  contents: write

concurrency:
  group: keyra-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Provjeri verziju
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify first-run import preserves encrypted vault data
        run: python3 .github/scripts/validate_initial_import_preflight.py

      - name: Verify Android/iOS localization parity
        run: python3 .github/scripts/validate_localizations.py

      - name: Verify no silent Android vault backup or device migration
        run: python3 .github/scripts/validate_vault_transfer.py

      - id: version
        name: Uskladi Android i iOS verziju
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)
          IOS_VERSION=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' ios/Keyra.xcodeproj/project.pbxproj | head -n 1 | tr -d '[:space:]')
          REQUESTED="${REQUESTED_VERSION:-}"

          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          else
            VERSION="$ANDROID_VERSION"
          fi

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid semantic version; expected MAJOR.MINOR.PATCH."
            exit 1
          fi
          test "$ANDROID_VERSION" = "$VERSION"
          test "$IOS_VERSION" = "$VERSION"

          # Published artifacts are immutable; never build or overwrite a
          # previously published version from a different source revision.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists. Bump the version for a new release."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android:
    name: Android paketi
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Provjeri Android privacy gate
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:fullBackupContent="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST"
          grep -q 'android.permission.HIDE_OVERLAY_WINDOWS' "$MANIFEST"

          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "Privacy regression: INTERNET permission nije dopušten bez eksplicitne revizije store/privacy deklaracija."
            exit 1
          fi

      - name: Izradi i provjeri Android pakete
        run: |
          set -euo pipefail
          gradle -p android \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Keyra-${VERSION}-Android-debug.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/Keyra-${VERSION}-Android-unsigned.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Keyra-${VERSION}-Android.aab"
          (
            cd dist
            sha256sum * > SHA256SUMS-Android.txt
          )

      - name: Omogući Android emulator akceleraciju
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Provjeri master-password UI na Android emulatoru prije izdanja
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: keyra-android-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS paketi
    needs: prepare
    runs-on: macos-26
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Provjeri Xcode i iOS SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR=$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_MAJOR=${SDK_VERSION%%.*}

          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Release zahtijeva Xcode 26 ili noviji."
            exit 1
          fi
          if [ -z "$SDK_MAJOR" ] || [ "$SDK_MAJOR" -lt 26 ]; then
            echo "Release zahtijeva iOS 26 SDK ili noviji."
            exit 1
          fi

      - name: Provjeri iOS privacy gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("ios/Keyra/PrivacyInfo.xcprivacy")
          with path.open("rb") as handle:
              manifest = plistlib.load(handle)

          if manifest.get("NSPrivacyTracking") is not False:
              raise SystemExit("Privacy regression: NSPrivacyTracking mora ostati false.")
          if manifest.get("NSPrivacyTrackingDomains") != []:
              raise SystemExit("Privacy regression: tracking domains moraju ostati prazni.")
          if manifest.get("NSPrivacyCollectedDataTypes") != []:
              raise SystemExit("Privacy regression: collected data types moraju ostati prazni.")

          api_types = manifest.get("NSPrivacyAccessedAPITypes", [])
          user_defaults_ok = any(
              entry.get("NSPrivacyAccessedAPIType") == "NSPrivacyAccessedAPICategoryUserDefaults"
              and "CA92.1" in entry.get("NSPrivacyAccessedAPITypeReasons", [])
              for entry in api_types
          )
          if not user_defaults_ok:
              raise SystemExit("Privacy regression: UserDefaults required-reason CA92.1 nedostaje.")
          PY

          if grep -R -E -n 'URLSession|NWConnection|WKWebView|Alamofire|Network\.framework' ios/Keyra ios/Keyra.xcodeproj/project.pbxproj; then
            echo "Privacy regression: pronađen je mrežni API/SDK. Potrebna je eksplicitna privacy/store revizija."
            exit 1
          fi

      - name: Izradi i provjeri iOS pakete
        run: |
          set -euo pipefail
          rm -rf build/release-device build/release-simulator build/release-analyze build/release-package
          mkdir -p dist

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/release-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/release-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/release-analyze \
            CODE_SIGNING_ALLOWED=NO \
            analyze

          APP_PATH="build/release-device/Build/Products/Release-iphoneos/Keyra.app"
          SIM_APP="build/release-simulator/Build/Products/Release-iphonesimulator/Keyra.app"
          test -d "$APP_PATH"
          test -d "$SIM_APP"

          mkdir -p build/release-package/Payload
          cp -R "$APP_PATH" build/release-package/Payload/
          (
            cd build/release-package
            zip -qry "../../dist/Keyra-${VERSION}-iOS-unsigned.ipa" Payload
          )

          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" "dist/Keyra-${VERSION}-iOS-Simulator.zip"

      - name: iOS simulator launch and first-run password UI regression
        timeout-minutes: 28
        run: |
          set -euo pipefail

          SIM_APP="build/release-simulator/Build/Products/Release-iphonesimulator/Keyra.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$SIM_APP/Info.plist")

          RUNTIME_ID=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin).get("runtimes", [])
          ios = []
          for runtime in runtimes:
              if not runtime.get("isAvailable"):
                  continue
              identifier = str(runtime.get("identifier", ""))
              if "iOS" not in identifier:
                  continue
              version = tuple(int(x) for x in re.findall(r"\d+", str(runtime.get("version", "0"))))
              ios.append((version, identifier))
          if not ios:
              raise SystemExit("Nije pronađen dostupan iOS simulator runtime.")
          print(max(ios)[1])
          ')

          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devicetypes", [])
          for prefix in ("iPhone 16", "iPhone 15", "iPhone 14", "iPhone"):
              for device in devices:
                  name = str(device.get("name", ""))
                  if name == prefix or name.startswith(prefix + " "):
                      print(device["identifier"])
                      raise SystemExit(0)
          raise SystemExit("Nije pronađen iPhone simulator device type.")
          ')

          SIM_NAME="Keyra-Release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UDID=$(xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          export UDID

          cleanup() {
            python3 - "$UDID" "$BUNDLE_ID" <<'PY'
          import subprocess, sys
          udid, bundle_id = sys.argv[1], sys.argv[2]
          for command in (
              ["xcrun", "simctl", "terminate", udid, bundle_id],
              ["xcrun", "simctl", "shutdown", udid],
              ["xcrun", "simctl", "delete", udid],
          ):
              try:
                  subprocess.run(command, check=False, timeout=20, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              except subprocess.TimeoutExpired:
                  pass
          PY
          }
          trap cleanup EXIT

          python3 - "$UDID" <<'PY'
          import subprocess, sys
          udid = sys.argv[1]
          try:
              subprocess.run(["xcrun", "simctl", "boot", udid], check=False, timeout=30, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          except subprocess.TimeoutExpired:
              print("simctl boot je prekoračio 30 s; nastavljam pratiti stvarni boot status.")
          PY

          python3 - "$UDID" <<'PY'
          import subprocess, sys
          subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=600)
          PY

          xcrun simctl install "$UDID" "$SIM_APP"
          LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" "$BUNDLE_ID")
          echo "$LAUNCH_OUTPUT"
          PID=$(echo "$LAUNCH_OUTPUT" | awk -F': ' 'NF > 1 {print $NF}' | tail -n 1)

          if ! [[ "$PID" =~ ^[0-9]+$ ]]; then
            echo "Nije dobiven valjan PID nakon pokretanja Keyre."
            exit 1
          fi

          sleep 3
          /bin/kill -0 "$PID"

          # Authentic screenshot of a freshly provisioned empty vault setup.
          # Capture before XCTest creates any synthetic credentials. The
          # screenshot is included in the real release assets for README.
          SCREENSHOT="dist/Keyra-${VERSION}-iOS-Onboarding.png"
          xcrun simctl io "$UDID" screenshot "$SCREENSHOT"
          test -s "$SCREENSHOT"
          python3 - "$SCREENSHOT" <<'PY'
          import pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert data.startswith(bytes.fromhex("89504e470d0a1a0a")), "iOS screenshot is not a PNG"
          assert len(data) > 10240, "iOS screenshot capture was unexpectedly small"
          PY

          # The release previously passed on simulator launch alone while its
          # separate main iOS UI workflow failed. Gate publication on the
          # actual synthetic first-run password-entry XCTest as well.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/release-ios-ui-tests \
            -parallel-testing-enabled NO \
            -only-testing:KeyraUITests/MasterPasswordEntryUITests/testFirstRunTypingVisibilityUnicodeCreateLockAndUnlock \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: SHA-256 kontrolne sume
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 * > SHA256SUMS-iOS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: keyra-ios-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Objavi izdanje
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: keyra-*
          path: dist
          merge-multiple: true

      - name: Pripremi bilješke izdanja
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # Keyra ${VERSION}

          Keyra 0.6.29 hardens first-run backup imports to prevent accidental replacement of a surviving encrypted vault. Android and iOS now use monotonic background timers for more reliable auto-lock, reject invalid stored lock intervals, and provide clearer privacy and deletion controls. iOS also enforces vault-directory file protection and backup exclusion without silently ignoring errors; Android rejects malformed decrypted backup text. Compact navigation, localization lookups and app/developer settings links were polished. KEYRA1/KEYRA2/KEYRAREC1 compatibility remains intact, and the release includes a genuine iOS onboarding screenshot.

          ## Verification
          - Android lint, JVM tests, privacy gates, first-run emulator checked first/second digit typing via Compose semantics, visibility/Unicode/11/12/256-character flow, vault creation, relock, wrong-password rejection and recovery regressions
          - iOS build, static analysis, privacy gates, Swift policy assertions, first-run simulator UI regression including 11/12/256-character boundaries, missing ciphertext and unavailable Keychain simulations
          - Android debug/unsigned APK and AAB; iOS simulator ZIP and unsigned IPA; a genuine first-run simulator PNG; SHA-256 checksum manifests
          - Issue #25: the original device crash remains unconfirmed without a reproducible device trace. Passing simulator tests alone do not establish a physical-device fix. See docs/MASTER_PASSWORD_INPUT_QA.md.

          ## Store signing
          Public workflow outputs are not automatically production-signed. Android store upload requires an appropriately signed AAB and iOS store upload requires Apple distribution signing and provisioning.

          Refer to docs/STORE_RELEASE_CHECKLIST.md before submission.
          EOF

      - name: Verify release assets and published SHA-256 manifests
        run: |
          set -euo pipefail
          for asset in \
            "Keyra-${VERSION}-Android-debug.apk" \
            "Keyra-${VERSION}-Android-unsigned.apk" \
            "Keyra-${VERSION}-Android.aab" \
            "Keyra-${VERSION}-iOS-Onboarding.png" \
            "Keyra-${VERSION}-iOS-Simulator.zip" \
            "Keyra-${VERSION}-iOS-unsigned.ipa" \
            "SHA256SUMS-Android.txt" \
            "SHA256SUMS-iOS.txt"; do
            test -s "dist/${asset}" || { echo "Missing or empty artifact: ${asset}"; exit 1; }
          done
          (
            cd dist
            sha256sum -c SHA256SUMS-Android.txt
            sha256sum -c SHA256SUMS-iOS.txt
          )

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Refusing to overwrite already-published v${VERSION} artifacts."
            exit 1
          fi
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Keyra ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            dist/*
