name: Android

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Provjeri Android privacy gate
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:fullBackupContent="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST"
          grep -q 'android.permission.HIDE_OVERLAY_WINDOWS' "$MANIFEST"

          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "Privacy regression: INTERNET permission nije dopušten bez eksplicitne revizije store/privacy deklaracija."
            exit 1
          fi

      - name: Provjeri Android aplikaciju
        run: |
          set -euo pipefail
          gradle -p android \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Instrumented first-run master-password UI regression (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon --stacktrace
