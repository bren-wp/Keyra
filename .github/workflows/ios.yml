name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Provjeri iOS aplikaciju
        run: |
          set -euo pipefail
          rm -rf build/ci-ios
          xcodebuild             -project ios/Keyra.xcodeproj             -scheme Keyra             -sdk iphonesimulator             -configuration Debug             -derivedDataPath build/ci-ios             CODE_SIGNING_ALLOWED=NO             build

          xcodebuild             -project ios/Keyra.xcodeproj             -scheme Keyra             -sdk iphonesimulator             -configuration Debug             -derivedDataPath build/ci-ios-analyze             CODE_SIGNING_ALLOWED=NO             analyze
