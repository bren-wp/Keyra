name: iOS

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Provjeri iOS aplikaciju
        run: |
          set -euo pipefail
          rm -rf build/ci-ios build/ci-ios-analyze build/ci-ios-device

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ci-ios \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ci-ios-analyze \
            CODE_SIGNING_ALLOWED=NO \
            analyze

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ci-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Provjeri pokretanje iOS aplikacije
        timeout-minutes: 5
        run: |
          set -euo pipefail

          APP_PATH="build/ci-ios/Build/Products/Debug-iphonesimulator/Keyra.app"
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")

          RUNTIME_ID=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin).get("runtimes", [])
          ios = []
          for runtime in runtimes:
              if not runtime.get("isAvailable"):
                  continue
              identifier = str(runtime.get("identifier", ""))
              if "iOS" not in identifier:
                  continue
              version = tuple(int(x) for x in re.findall(r"\d+", str(runtime.get("version", "0"))))
              ios.append((version, identifier))
          if not ios:
              raise SystemExit("Nije pronađen dostupan iOS simulator runtime.")
          print(max(ios)[1])
          ')

          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devicetypes", [])
          preferred = ("iPhone 16", "iPhone 15", "iPhone 14", "iPhone")
          for prefix in preferred:
              for device in devices:
                  name = str(device.get("name", ""))
                  if name == prefix or name.startswith(prefix + " "):
                      print(device["identifier"])
                      raise SystemExit(0)
          raise SystemExit("Nije pronađen iPhone simulator device type.")
          ')

          SIM_NAME="Keyra-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UDID=$(xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          export UDID

          cleanup() {
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          python3 - "$UDID" <<'PY'
          import subprocess, sys

          udid = sys.argv[1]
          try:
              subprocess.run(
                  ["xcrun", "simctl", "boot", udid],
                  check=False,
                  timeout=45,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.TimeoutExpired:
              print("simctl boot je prekoračio 45 s; provjeravam boot status.")
          PY

          python3 - "$UDID" <<'PY'
          import subprocess, sys

          udid = sys.argv[1]
          subprocess.run(
              ["xcrun", "simctl", "bootstatus", udid, "-b"],
              check=True,
              timeout=120,
          )
          PY

          xcrun simctl install "$UDID" "$APP_PATH"
          LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" "$BUNDLE_ID")
          echo "$LAUNCH_OUTPUT"

          PID=$(echo "$LAUNCH_OUTPUT" | awk -F': ' 'NF > 1 {print $NF}' | tail -n 1)
          if ! [[ "$PID" =~ ^[0-9]+$ ]]; then
            echo "Nije dobiven valjan PID nakon pokretanja Keyre na simulatoru."
            exit 1
          fi

          sleep 3
          if ! xcrun simctl spawn "$UDID" launchctl print "gui/501/$BUNDLE_ID" >/dev/null 2>&1; then
            echo "Keyra nije ostala pokrenuta nakon launch smoke testa."
            exit 1
          fi
