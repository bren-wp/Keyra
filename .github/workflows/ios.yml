name: iOS

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Provjeri iOS aplikaciju
        run: |
          set -euo pipefail
          rm -rf build/ci-ios build/ci-ios-analyze

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ci-ios \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ci-ios-analyze \
            CODE_SIGNING_ALLOWED=NO \
            analyze

          xcodebuild \
            -project ios/Keyra.xcodeproj \
            -scheme Keyra \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ci-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Provjeri pokretanje iOS aplikacije
        timeout-minutes: 4
        run: |
          set -euo pipefail
          APP_PATH="build/ci-ios/Build/Products/Debug-iphonesimulator/Keyra.app"
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")

          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          ')

          export UDID
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true

          READY=0
          for _ in $(seq 1 60); do
            STATE=$(xcrun simctl list devices -j | python3 -c '
          import json, sys, os
          target = os.environ["UDID"]
          data = json.load(sys.stdin).get("devices", {})
          for runtime_devices in data.values():
              for device in runtime_devices:
                  if device.get("udid") == target:
                      print(device.get("state", ""))
                      raise SystemExit(0)
          print("")
          ')
            if [ "$STATE" = "Booted" ]; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "iOS simulator nije dosegnuo stanje Booted unutar 60 sekundi."
            xcrun simctl shutdown "$UDID" || true
            exit 1
          fi

          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 3
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$UDID" || true
